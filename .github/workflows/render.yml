name: Render Crime Video

on:
  workflow_dispatch:
    inputs:
      video_data:
        description: 'JSON data from Pipedream'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Arabic Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-arabic

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install moviepy==1.0.3
          pip install arabic-reshaper python-bidi
          pip install cloudinary requests
          pip install imageio-ffmpeg

      - name: Download Arabic Font
        run: |
          mkdir -p fonts
          wget -q -O fonts/NotoNaskhArabic-Regular.ttf \
            "https://github.com/google/fonts/raw/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf"
          ls -la fonts/

      - name: Render Video
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          VIDEO_DATA: ${{ github.event.inputs.video_data }}
        run: |
          python .github/workflows/render_script.py
